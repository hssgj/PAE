name: Build PAE APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'pae-android/**'
      - 'prototype_v0/**'
      - 'start-mobile.sh'
      - '.github/workflows/build-pae-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: python -m py_compile prototype_v0/mobile_server.py prototype_v0/gmail_source.py
      - run: python -m pytest -q -p no:cacheprovider prototype_v0
      - run: bash -n start-mobile.sh
      - run: gradle --no-daemon :app:assembleDebug
        working-directory: pae-android
      - uses: actions/upload-artifact@v4
        with:
          name: pae-mobile-debug
          path: pae-android/app/build/outputs/apk/debug/app-debug.apk
